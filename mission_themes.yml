themes:
  - id: Daily
    order: 0
    name: デイリー（昼/夜）
    missions:
      - id: completed
        name: Completed
        selector: ".missions > ol:nth-child(3) > li:nth-child(1)"
        reward_mode: once
      - id: views20
        name: 20 views
        selector: "div.content:nth-child(4) > ol:nth-child(2) > li:nth-child(1)"
        progress_mode: received_num
        reward_mode: incremental
      - id: gift10
        selector: "div.content:nth-child(4) > ol:nth-child(4) > li:nth-child(1)"
        reward_mode: once
        gift: 10
      - id: comment39
        selector: "div.content:nth-child(4) > ol:nth-child(4) > li:nth-child(2)"
        reward_mode: once
        comment_mode: thanks39
      - id: keep-until-deadline
        selector: "div.content:nth-child(4) > ol:nth-child(4) > li:nth-child(3)"
        reward_mode: once
        receive_policy: manual_until_hours
        receive_hours:
          - 2
          - 14
      - id: reward-only
        selector: "div.content:nth-child(4) > ol:nth-child(4) > li:nth-child(4)"
        reward_mode: once

